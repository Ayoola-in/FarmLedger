<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - FarmLedger</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <meta name="theme-color" content="#10b981">
</head>
<body class="dark-mode">
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <div class="sidebar-overlay" id="sidebar-overlay"></div>
        <nav class="sidebar">
            <div class="brand">
                <img src="assets/logo.png" alt="FarmLedger Logo" class="brand-logo">
                <h2>FarmLedger</h2>
            </div>
            <ul class="nav-links">
                <li><a href="index.html"><i class="ph ph-squares-four"></i> Dashboard</a></li>
                <li><a href="birds.html"><i class="ph ph-bird"></i> Birds</a></li>
                <li><a href="eggs.html"><i class="ph ph-egg"></i> Eggs</a></li>
                <li><a href="feed.html"><i class="ph ph-grain"></i> Feed</a></li>
                <li><a href="vaccines.html"><i class="ph ph-syringe"></i> Vaccines</a></li>
                <li><a href="finance.html"><i class="ph ph-currency-circle-dollar"></i> Finance</a></li>
                <li><a href="reports.html" class="active"><i class="ph ph-chart-line-up"></i> Reports</a></li>
                <li><a href="settings.html"><i class="ph ph-gear"></i> Settings</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <img src="assets/logo.png" class="print-only-logo" alt="FarmLedger Logo">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <button id="hamburger" class="hamburger btn btn-icon">☰</button>
                    <h1 style="margin: 0;">Reports & Analytics</h1>
                </div>
                <div class="header-actions">
                    <button id="theme-toggle" class="btn btn-icon" title="Toggle Theme"><i class="ph ph-moon" style="font-size: 20px;"></i></button>
                    <button class="btn" id="btn-print" onclick="window.print()"><i class="ph ph-printer"></i> Print Report</button>
                </div>
            </header>

            <!-- Profit and Loss Statement -->
            <div class="glass-card" style="margin-bottom: 20px;">
                <h2>Profit and Loss Statement (All Time)</h2>
                <div class="dashboard-grid">
                    <div>
                        <h3>Revenue</h3>
                        <ul id="revenue-list" style="list-style:none; padding:0; line-height: 1.6;"></ul>
                        <hr>
                        <strong>Total Revenue: <span id="report-total-revenue">₦0.00</span></strong>
                    </div>
                    <div>
                        <h3>Expenses</h3>
                        <ul id="expense-list" style="list-style:none; padding:0; line-height: 1.6;"></ul>
                        <hr>
                        <strong>Total Expenses: <span id="report-total-expenses">₦0.00</span></strong>
                    </div>
                </div>
                <div style="margin-top: 20px; font-size: 1.5em; text-align: center;">
                    <strong>Net Profit: <span id="report-net-profit">₦0.00</span></strong>
                </div>
            </div>

            <!-- Expense Breakdown Chart -->
            <div class="glass-card chart-container" style="margin-top: 20px;">
                <h2>Expense Breakdown (Chart)</h2>
                <div class="chart-wrapper">
                    <canvas id="expenseChart"></canvas>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/db.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/app.js"></script>
    <script src="js/reports.js"></script>
</body>
</html>
