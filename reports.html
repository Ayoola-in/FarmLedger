<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - FarmLedger</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <meta name="theme-color" content="#2e7d32">
</head>
<body class="dark-mode">
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="brand">
                <h2>FarmLedger</h2>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="birds.html">Birds</a></li>
                <li><a href="eggs.html">Eggs</a></li>
                <li><a href="feed.html">Feed</a></li>
                <li><a href="finance.html">Finance</a></li>
                <li><a href="reports.html" class="active">Reports</a></li>
                <li><a href="settings.html">Settings</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <h1>Reports & Analytics</h1>
                <div class="header-actions">
                    <button id="theme-toggle" class="btn btn-icon">Toggle Theme</button>
                    <button class="btn" id="btn-print" onclick="window.print()">Print Report</button>
                </div>
            </header>

            <!-- Profit and Loss Statement -->
            <div class="glass-card" style="margin-bottom: 20px;">
                <h2>Profit and Loss Statement (All Time)</h2>
                <div class="dashboard-grid">
                    <div>
                        <h3>Revenue</h3>
                        <ul id="revenue-list" style="list-style:none; padding:0; line-height: 1.6;"></ul>
                        <hr>
                        <strong>Total Revenue: <span id="report-total-revenue">₦0.00</span></strong>
                    </div>
                    <div>
                        <h3>Expenses</h3>
                        <ul id="expense-list" style="list-style:none; padding:0; line-height: 1.6;"></ul>
                        <hr>
                        <strong>Total Expenses: <span id="report-total-expenses">₦0.00</span></strong>
                    </div>
                </div>
                <div style="margin-top: 20px; font-size: 1.5em; text-align: center;">
                    <strong>Net Profit: <span id="report-net-profit">₦0.00</span></strong>
                </div>
            </div>

            <!-- Expense Breakdown Chart -->
            <div class="glass-card chart-container" style="max-width: 500px; margin: 0 auto;">
                <h3 style="text-align: center;">Expense Breakdown</h3>
                <canvas id="expenseChart"></canvas>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/db.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/app.js"></script>
    <script src="js/reports.js"></script>
</body>
</html>
