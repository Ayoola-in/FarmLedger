<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birds - FarmLedger</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <meta name="theme-color" content="#2e7d32">
</head>
<body class="dark-mode">
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <div class="sidebar-overlay" id="sidebar-overlay"></div>
        <nav class="sidebar">
            <div class="brand">
                <h2>FarmLedger</h2>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="birds.html" class="active">Birds</a></li>
                <li><a href="eggs.html">Eggs</a></li>
                <li><a href="feed.html">Feed</a></li>
                <li><a href="finance.html">Finance</a></li>
                <li><a href="reports.html">Reports</a></li>
                <li><a href="settings.html">Settings</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <button id="hamburger" class="hamburger btn btn-icon">☰</button>
                    <h1 style="margin: 0;">Flock Management</h1>
                </div>
                <div class="header-actions">
                    <button id="theme-toggle" class="btn btn-icon">Toggle Theme</button>
                </div>
            </header>

            <div class="glass-card" style="margin-bottom: 20px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2>Active Flocks</h2>
                    <button class="btn" id="btn-add-flock">+ Register New Flock</button>
                </div>
                
                <div class="table-responsive">
                    <table class="data-table" id="flocks-table">
                        <thead>
                            <tr>
                                <th>Name/Batch</th>
                                <th>Breed</th>
                                <th>Purchase Date</th>
                                <th>Initial Qty</th>
                                <th>Alive</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="flocks-table-body">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Add Flock Modal (Hidden by default) -->
            <div id="modal-add-flock" class="modal" style="display: none;">
                <div class="modal-content glass-card">
                    <h2>Register New Flock</h2>
                    <form id="form-add-flock">
                        <div class="form-group">
                            <label>Flock Name / Batch Number</label>
                            <input type="text" id="flock-name" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Breed</label>
                            <input type="text" id="flock-breed" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Source/Supplier</label>
                            <input type="text" id="flock-source" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>Purchase Date</label>
                            <input type="date" id="flock-date" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Quantity Purchased</label>
                            <input type="number" id="flock-qty" class="form-control" required min="1">
                        </div>
                        <div class="form-group">
                            <label>Total Cost</label>
                            <input type="number" id="flock-cost" class="form-control" step="0.01">
                        </div>
                        <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
                            <button type="button" class="btn" style="background-color: #555;" id="btn-cancel-flock">Cancel</button>
                            <button type="submit" class="btn">Save Flock</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/db.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/app.js"></script>
    <script src="js/birds.js"></script>
</body>
</html>
