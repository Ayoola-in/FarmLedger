<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed - FarmLedger</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <meta name="theme-color" content="#10b981">
</head>
<body class="dark-mode">
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <div class="sidebar-overlay" id="sidebar-overlay"></div>
        <nav class="sidebar">
            <div class="brand">
                <img src="assets/logo.png" alt="FarmLedger Logo" class="brand-logo">
                <h2>FarmLedger</h2>
            </div>
            <ul class="nav-links">
                <li><a href="index.html"><i class="ph ph-squares-four"></i> Dashboard</a></li>
                <li><a href="birds.html"><i class="ph ph-bird"></i> Birds</a></li>
                <li><a href="eggs.html"><i class="ph ph-egg"></i> Eggs</a></li>
                <li><a href="feed.html" class="active"><i class="ph ph-grain"></i> Feed</a></li>
                <li><a href="vaccines.html"><i class="ph ph-syringe"></i> Vaccines</a></li>
                <li><a href="finance.html"><i class="ph ph-currency-circle-dollar"></i> Finance</a></li>
                <li><a href="reports.html"><i class="ph ph-chart-line-up"></i> Reports</a></li>
                <li><a href="settings.html"><i class="ph ph-gear"></i> Settings</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <img src="assets/logo.png" class="print-only-logo" alt="FarmLedger Logo">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <button id="hamburger" class="hamburger btn btn-icon">☰</button>
                    <h1 style="margin: 0;">Feed Inventory</h1>
                </div>
                <div class="header-actions">
                    <button id="theme-toggle" class="btn btn-icon" title="Toggle Theme"><i class="ph ph-moon" style="font-size: 20px;"></i></button>
                </div>
            </header>

            <div class="dashboard-grid" id="feed-summary-grid" style="margin-bottom: 20px;">
                <!-- Populated by JS -->
            </div>

            <div class="glass-card" style="margin-bottom: 20px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2>Feed Inventory</h2>
                    <button class="btn" id="btn-add-feed"><i class="ph ph-plus"></i> Add Feed Stock</button>
                </div>
                
                <div class="table-responsive">
                    <table class="data-table" id="feed-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Supplier</th>
                                <th>Type</th>
                                <th>Quantity (kg)</th>
                                <th>Total Cost</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="feed-table-body">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Add Feed Modal -->
            <div id="modal-add-feed" class="modal" style="display: none;">
                <div class="modal-content glass-card">
                    <h2>Record Feed Purchase</h2>
                    <form id="form-add-feed">
                        <div class="form-group">
                            <label>Date</label>
                            <input type="date" id="feed-date" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Supplier</label>
                            <input type="text" id="feed-supplier" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Feed Type</label>
                            <select id="feed-type" class="form-control">
                                <option value="Starter">Starter</option>
                                <option value="Grower">Grower</option>
                                <option value="Layer">Layer</option>
                                <option value="Finisher">Finisher</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Total Quantity (kg)</label>
                            <input type="number" id="feed-qty" class="form-control" required min="1" step="0.1">
                        </div>
                        <div class="form-group">
                            <label>Total Cost</label>
                            <input type="number" id="feed-cost" class="form-control" required step="0.01">
                        </div>
                        <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
                            <button type="button" class="btn" style="background-color: #555;" id="btn-cancel-feed">Cancel</button>
                            <button type="submit" class="btn">Save Purchase</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/db.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/app.js"></script>
    <script src="js/feed.js"></script>
</body>
</html>
