<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eggs - FarmLedger</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <meta name="theme-color" content="#10b981">
</head>
<body class="dark-mode">
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <div class="sidebar-overlay" id="sidebar-overlay"></div>
        <nav class="sidebar">
            <div class="brand">
                <img src="assets/logo.png" alt="FarmLedger Logo" class="brand-logo">
                <h2>FarmLedger</h2>
            </div>
            <ul class="nav-links">
                <li><a href="index.html"><i class="ph ph-squares-four"></i> Dashboard</a></li>
                <li><a href="birds.html"><i class="ph ph-bird"></i> Birds</a></li>
                <li><a href="eggs.html" class="active"><i class="ph ph-egg"></i> Eggs</a></li>
                <li><a href="feed.html"><i class="ph ph-grain"></i> Feed</a></li>
                <li><a href="vaccines.html"><i class="ph ph-syringe"></i> Vaccines</a></li>
                <li><a href="finance.html"><i class="ph ph-currency-circle-dollar"></i> Finance</a></li>
                <li><a href="reports.html"><i class="ph ph-chart-line-up"></i> Reports</a></li>
                <li><a href="settings.html"><i class="ph ph-gear"></i> Settings</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <img src="assets/logo.png" class="print-only-logo" alt="FarmLedger Logo">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <button id="hamburger" class="hamburger btn btn-icon">☰</button>
                    <h1 style="margin: 0;">Egg Production</h1>
                </div>
                <div class="header-actions">
                    <button id="theme-toggle" class="btn btn-icon" title="Toggle Theme"><i class="ph ph-moon" style="font-size: 20px;"></i></button>
                </div>
            </header>

            <div class="dashboard-grid" style="margin-bottom: 20px;">
                <div class="card glass-card">
                    <h3>Collected Today</h3>
                    <p class="metric" id="metric-eggs-today">0</p>
                </div>
                <div class="card glass-card">
                    <h3>Good Eggs</h3>
                    <p class="metric" id="metric-eggs-good">0</p>
                </div>
                <div class="card glass-card">
                    <h3>Broken/Dirty</h3>
                    <p class="metric" id="metric-eggs-bad" style="color: #e53935;">0</p>
                </div>
            </div>

            <div class="glass-card" style="margin-bottom: 20px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2>Daily Records</h2>
                    <button class="btn" id="btn-add-eggs"><i class="ph ph-plus"></i> Record Egg Collection</button>
                </div>
                
                <div class="table-responsive">
                    <table class="data-table" id="eggs-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Flock</th>
                                <th>Total Collected</th>
                                <th>Good</th>
                                <th>Broken</th>
                            </tr>
                        </thead>
                        <tbody id="eggs-table-body">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Add Egg Record Modal -->
            <div id="modal-add-eggs" class="modal" style="display: none;">
                <div class="modal-content glass-card">
                    <h2>Record Egg Collection</h2>
                    <form id="form-add-eggs">
                        <div class="form-group">
                            <label>Date</label>
                            <input type="date" id="egg-date" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Select Flock</label>
                            <select id="egg-flock" class="form-control" required>
                                <!-- Populated dynamically -->
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Total Eggs Collected</label>
                            <input type="number" id="egg-total" class="form-control" required min="1">
                        </div>
                        <div class="form-group">
                            <label>Broken Eggs</label>
                            <input type="number" id="egg-broken" class="form-control" required min="0" value="0">
                        </div>
                        <div class="form-group">
                            <label>Dirty Eggs</label>
                            <input type="number" id="egg-dirty" class="form-control" required min="0" value="0">
                        </div>
                        <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
                            <button type="button" class="btn" style="background-color: #555;" id="btn-cancel-eggs">Cancel</button>
                            <button type="submit" class="btn">Save Record</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/db.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/app.js"></script>
    <script src="js/eggs.js"></script>
</body>
</html>
