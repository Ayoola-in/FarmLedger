<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance - FarmLedger</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <meta name="theme-color" content="#2e7d32">
</head>
<body class="dark-mode">
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <div class="sidebar-overlay" id="sidebar-overlay"></div>
        <nav class="sidebar">
            <div class="brand">
                <h2>FarmLedger</h2>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="birds.html">Birds</a></li>
                <li><a href="eggs.html">Eggs</a></li>
                <li><a href="feed.html">Feed</a></li>
                <li><a href="finance.html" class="active">Finance</a></li>
                <li><a href="reports.html">Reports</a></li>
                <li><a href="settings.html">Settings</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <button id="hamburger" class="hamburger btn btn-icon">☰</button>
                    <h1 style="margin: 0;">Financials</h1>
                </div>
                <div class="header-actions">
                    <button id="theme-toggle" class="btn btn-icon">Toggle Theme</button>
                </div>
            </header>

            <div class="dashboard-grid" style="margin-bottom: 20px;">
                <div class="card glass-card">
                    <h3>Gross Revenue</h3>
                    <p class="metric" id="metric-revenue">₦0.00</p>
                </div>
                <div class="card glass-card">
                    <h3>Total Expenses</h3>
                    <p class="metric" id="metric-expenses" style="color: #e53935;">₦0.00</p>
                </div>
                <div class="card glass-card">
                    <h3>Net Profit</h3>
                    <p class="metric" id="metric-profit">₦0.00</p>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                <div class="glass-card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <h2>Recent Sales</h2>
                        <button class="btn" id="btn-add-sale">+ Record Sale</button>
                    </div>
                    <div class="table-responsive">
                        <table class="data-table" id="sales-table">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Category</th>
                                    <th>Total</th>
                                </tr>
                            </thead>
                            <tbody id="sales-table-body">
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="glass-card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <h2>Recent Expenses</h2>
                        <button class="btn" id="btn-add-expense" style="background-color: #d32f2f;">+ Record Expense</button>
                    </div>
                    <div class="table-responsive">
                        <table class="data-table" id="expenses-table">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Category</th>
                                    <th>Amount</th>
                                </tr>
                            </thead>
                            <tbody id="expenses-table-body">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Add Sale Modal -->
            <div id="modal-add-sale" class="modal" style="display: none;">
                <div class="modal-content glass-card">
                    <h2>Record Sale</h2>
                    <form id="form-add-sale">
                        <div class="form-group">
                            <label>Date</label>
                            <input type="date" id="sale-date" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Category</label>
                            <select id="sale-category" class="form-control" required>
                                <option value="Egg Sales">Egg Sales</option>
                                <option value="Bird Sales">Bird Sales</option>
                                <option value="Manure Sales">Manure Sales</option>
                                <option value="Other">Other Income</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Description/Product</label>
                            <input type="text" id="sale-product" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Quantity</label>
                            <input type="number" id="sale-qty" class="form-control" min="1" value="1">
                        </div>
                        <div class="form-group">
                            <label>Total Amount Received</label>
                            <input type="number" id="sale-total" class="form-control" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label>Customer (Optional)</label>
                            <input type="text" id="sale-customer" class="form-control">
                        </div>
                        <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
                            <button type="button" class="btn" style="background-color: #555;" id="btn-cancel-sale">Cancel</button>
                            <button type="submit" class="btn">Save Sale</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Add Expense Modal -->
            <div id="modal-add-expense" class="modal" style="display: none;">
                <div class="modal-content glass-card">
                    <h2>Record Expense</h2>
                    <form id="form-add-expense">
                        <div class="form-group">
                            <label>Date</label>
                            <input type="date" id="expense-date" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Category</label>
                            <select id="expense-category" class="form-control" required>
                                <option value="Feed">Feed</option>
                                <option value="Medication">Medication</option>
                                <option value="Transport">Transport</option>
                                <option value="Salary">Salary</option>
                                <option value="Utilities">Utilities</option>
                                <option value="Maintenance">Maintenance</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Amount</label>
                            <input type="number" id="expense-amount" class="form-control" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label>Vendor/Supplier</label>
                            <input type="text" id="expense-vendor" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>Description</label>
                            <input type="text" id="expense-description" class="form-control" required>
                        </div>
                        <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
                            <button type="button" class="btn" style="background-color: #555;" id="btn-cancel-expense">Cancel</button>
                            <button type="submit" class="btn" style="background-color: #d32f2f;">Save Expense</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/db.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/app.js"></script>
    <script src="js/finance.js"></script>
</body>
</html>
